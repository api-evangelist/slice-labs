aid: slice-labs
name: Slice Labs
description: >-
  Slice Labs is a New York-based insurtech company that operates as an
  insurance-as-a-service cloud platform provider. Founded in 2015 and
  publicly launched in 2016, Slice originally offered on-demand insurance
  products for the sharing economy (homeshare, rideshare, cyber) and then
  pivoted to offering its underlying digital insurer stack — branded
  Insurance Cloud Services (ICS) — to other carriers, MGAs, and brands.
  The ICS platform packages pricing, rating, licensing, real-time and
  automated underwriting, policy servicing, claims, and capacity into a
  cloud-hosted, API-embeddable subscription. The company's modern product
  surface focuses on 100% digital small-business insurance distributed
  through agents and partners (currently Contractors General Liability,
  with Commercial Real Estate and Excess Casualty announced as coming
  soon) on top of Slice Mind, an AI/ML, behavioral-science, and LLM-driven
  intelligence layer. Slice Labs publicly markets its platform as "fully
  embeddable via API," but the developer portal, OpenAPI specs, SDKs, and
  endpoint reference are not exposed on the open web — integration is
  gated behind a B2B carrier/partner relationship. The official GitHub
  organization (github.com/slicelabs) exists but is archived with zero
  public repositories, and there is no public developer.slice domain
  serving documentation. As a result this profile captures the company,
  product, and platform surface only; no OpenAPI, AsyncAPI, JSON Schema,
  Naftiko capability, plan, rate-limit, or FinOps artifact is generated
  here because none of the underlying contracts are publicly observable.
